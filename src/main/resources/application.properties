server.port=8084

# Thymeleaf templates and static resource content versioning
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

spring.application.name=lostsystem

# 单实例拾物向量索引：请将目录放在持久磁盘，并保持重启时路径一致。
lost-found.index.path=${LOST_PROPERTY_INDEX_PATH:./data/lost-property-index.json}
lost-found.index.model-version=bge-small-zh-v15-q-v1
lost-found.index.reconcile-delay-ms=60000
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY}
# DeepSeek OpenAI Compatible API
# ChatConfig also uses these settings to create deepSeekStreamingChatModel.
langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com
langchain4j.open-ai.chat-model.model-name=deepseek-flash
# ????????/?????????
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false



# ==============================
# MySQL DataSource
# ==============================

# ???????
spring.datasource.url=jdbc:mysql://localhost:3306/lost_found?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai

# ??????
spring.datasource.username=root

# ?????
spring.datasource.password=${DB_PASSWORD}

# MySQL JDBC ??
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==============================
# MyBatis-Plus
# ==============================

# ????????? SQL
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ??????????? Java ??
# ?? item_name -> itemName
mybatis-plus.configuration.map-underscore-to-camel-case=true
# Redis，按你本机实际地址填写
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0

# JWT：使用本项目独立的随机密钥
app.jwt.secret=${LOST_FOUND_JWT_SECRET}
app.jwt.expiration-seconds=7200

# 与网盘项目使用不同的 Redis 前缀
app.auth.redis-session-prefix=lost-found:auth:session:

# 登录防护
app.login-protection.request-limit=30
app.login-protection.request-window-seconds=60
app.login-protection.max-password-failures=5
app.login-protection.failure-window-seconds=600
app.login-protection.lock-seconds=600
# ?????? 5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ??????
lost-found.upload.path=${LOST_FOUND_UPLOAD_PATH:./data/uploads}